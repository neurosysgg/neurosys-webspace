; PHP's per-directory settings for this webroot, read by the CGI and FastCGI SAPIs on each request
; and cached for user_ini.cache_ttl (300 seconds on Strato), so a change here takes up to five
; minutes to be in force after a push. Only PHP_INI_PERDIR and PHP_INI_USER directives take effect;
; opcache.enable, for one, cannot be switched on from here.
;
; Never readable over HTTP: public/.htaccess and tools/dev-router.php both hand this path to the
; router, which answers it exactly as it answers any address that does not exist.

; PHP 8.5 deprecates deriving $_SERVER['argv'] from the query string, and the live host has this on,
; so every request raised that deprecation at startup. Nothing on the web side reads argv; the CLI
; tools under tools/ get theirs regardless of this setting. `health v1 settings` checks it.
register_argc_argv = Off
