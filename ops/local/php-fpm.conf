; The confined php-fpm instance for neurosys.localhost and neurosys.local — its own master, run by
; php-fpm-neurosys.service. The system php-fpm and its www pool are untouched; they serve the side
; door (machine.neurosys.localhost) and every other site. See docs/research/attested-single-box.md (Phase 1).

[global]
pid = /run/php-fpm-neurosys/php-fpm.pid
error_log = syslog
syslog.ident = php-fpm-neurosys
; A worker killed by the filter is a warning in the master's log; keep it.
log_level = notice
daemonize = no

[neurosys]
; No user/group: the master is already neurosys-php, and unprivileged it could not switch anyway.

listen = /run/php-fpm-neurosys/fpm.sock
listen.mode = 0660
; httpd connects, and so does the confinement suite, which runs as the developer.
listen.acl_users = http,neuroSYS

; One request per process. No two requests share a heap or an engine global, so state a fatal
; leaves behind is freed with the process before any later request could reach it. A static pool
; keeps a forked worker waiting; opcache's shared memory belongs to the master and survives.
pm = static
pm.max_children = 4
pm.max_requests = 1

; Reachable only over the socket: httpd hands it .php files alone. The suite reads its accepted-
; connection count to tell which pool a request through httpd really reached.
pm.status_path = /fpm-status

clear_env = yes
security.limit_extensions = .php

; The PHP-level layer above the kernel's: the calls a page never needs, refused before they would
; reach a syscall the filter kills the process for.
php_admin_value[disable_functions] = proc_open,popen,exec,shell_exec,system,passthru,pcntl_exec,pcntl_fork,pcntl_rfork,mail,dl
php_admin_flag[allow_url_fopen] = off
