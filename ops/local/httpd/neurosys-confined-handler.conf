# Included inside each neuro.SYS VirtualHost that should run on the confined pool. A vhost's own
# <FilesMatch> is merged after the server's, so this one wins over httpd.conf's www handler.
# The backend name is the pool's own, so mod_proxy never shares a worker with the www socket.
<FilesMatch \.php$>
    SetHandler "proxy:unix:/run/php-fpm-neurosys/fpm.sock|fcgi://neurosys-confined"
</FilesMatch>
