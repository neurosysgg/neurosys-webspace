# The side door — https://machine.neurosys.localhost, the one neuro.SYS host NOT on the confined
# pool. It serves the same working tree through the system php-fpm's neurosys-sidedoor pool: the
# same user as the confined pool, so the files both write stay readable to both, and none of its
# sandbox, so the machine service can run a command and a signed write can spend the update
# serial, which lives beside the deployment rather than in data/. Loopback only.
# See docs/research/attested-single-box.md (Phase 1).

<VirtualHost *:443>
    SetEnv PHPANTA_ENVIRONMENT development
    ServerName machine.neurosys.localhost
    DocumentRoot "/srv/http/neurosys/public"

    SSLEngine on
    SSLCertificateFile    "/etc/httpd/conf/machine.neurosys.localhost.crt"
    SSLCertificateKeyFile "/etc/httpd/conf/machine.neurosys.localhost.key"

    <Directory "/srv/http/neurosys/public">
        AllowOverride All
        Require local
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php-fpm/neurosys-sidedoor.sock|fcgi://neurosys-sidedoor"
    </FilesMatch>

    ErrorLog "/var/log/httpd/neurosys-machine-error.log"
    CustomLog "/var/log/httpd/neurosys-machine-access.log" common
</VirtualHost>
