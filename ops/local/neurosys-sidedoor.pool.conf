; The side door's pool, in the system php-fpm (/etc/php/php-fpm.d/). Unconfined on purpose: it is
; what machine.neurosys.localhost runs on, for the machine service and the signed writes that spend
; the update serial. Same user as the confined pool, so files either writes at 0600 — the passkey
; store, a drop, the serial — stay readable to the other. See docs/research/attested-single-box.md (Phase 1).
[neurosys-sidedoor]
user = neurosys-php
group = http
listen = /run/php-fpm/neurosys-sidedoor.sock
listen.owner = http
listen.group = http
listen.mode = 0660
listen.acl_users = http,neuroSYS

pm = ondemand
pm.max_children = 2
pm.process_idle_timeout = 30s
